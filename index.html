<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>⧉ بوابة الزمن | Islam Mendjel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #00ffcc;
      background: radial-gradient(ellipse at center, #000 0%, #1a1a1a 100%);
      overflow: hidden;
    }

    h1 {
      margin: 10px 0;
      font-size: 2.5rem;
      text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
    }

    #date, #time {
      font-size: 2rem;
      text-shadow: 0 0 8px #0ff;
    }

    p {
      margin: 10px 0;
      font-size: 1rem;
      color: #66ffff;
      text-shadow: 0 0 5px #00cccc;
    }

    /* Animated glowing effect */
    body::before {
      content: '';
      position: absolute;
      width: 300%;
      height: 300%;
      background: conic-gradient(from 0deg, #00ffff 0%, #001f1f 50%, #00ffff 100%);
      animation: spin 30s linear infinite;
      z-index: -1;
      opacity: 0.05;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <script>
    function updateClock() {
      const now = new Date();
      const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
      const monthNames = ["جانفي", "فيفري", "مارس", "أفريل", "ماي", "جوان", "جويلية", "أوت", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];

      const day = dayNames[now.getDay()];
      const month = monthNames[now.getMonth()];
      const date = now.getDate();
      const year = now.getFullYear();

      let hour = now.getHours();
      let minute = now.getMinutes();
      let second = now.getSeconds();

      hour = hour < 10 ? "0" + hour : hour;
      minute = minute < 10 ? "0" + minute : minute;
      second = second < 10 ? "0" + second : second;

      document.getElementById("date").innerText = `${day}, ${month} ${date}, ${year}`;
      document.getElementById("time").innerText = `${hour}:${minute}:${second}`;
    }

    setInterval(updateClock, 1000);
    window.onload = updateClock;
  </script>
</head>
<body>
  <h1>⧉ Welcome to the Time Portal ⧉</h1>
  <h1>⏳ Current Time ⏳</h1>
  <p id="date"></p>
  <p id="time"></p>
  <br>
  <p>Created by Islam Mendjel</p>
  <p>&copy; 2022 - 2023</p>
</body>
</html>
